name: Update CTF events

on:
  schedule:
    - cron: "0 1 * * *"   # 每日 01:00 UTC(北京 09:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python scripts/fetch_events.py
      - name: Commit & redeploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.md
          if git diff --cached --quiet; then
            echo "无变化,跳过"
          else
            git commit -m "chore: 同步 CTF 赛事日程"
            git push
            # GITHUB_TOKEN 的 push 不会触发其他 workflow,这里手动唤起部署
            gh workflow run deploy.yml --repo bishouyou/bishou-blog
          fi
        env:
          GH_TOKEN: ${{ github.token }}